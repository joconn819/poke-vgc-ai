[tool.poetry]
name = "poke-vgc-rl"
version = "0.1.0"
description = "State-of-the-art AI for Pokemon VGC using RL and belief modeling"
authors = ["Copilot <223556219+Copilot@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
poke-env = "^0.5.5"
gymnasium = "^0.28.0"
stable-baselines3 = "^2.0.0"
torch = "^2.0.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
pydantic = "^2.0.0"
requests = "^2.31.0"
tqdm = "^4.66.0"
wandb = "^0.15.0"
transformers = "^4.33.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
black = "^23.7.0"
mypy = "^1.5.0"
ruff = "^0.0.285"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

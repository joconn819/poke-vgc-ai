<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2c">
  <title>VGC Agent Training Progress</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#131e31; --line:#263650; --muted:#a7b5c9; --text:#eef4ff; --blue:#72b7ff; --green:#72dfb1; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(ellipse at 15% 0%,#172846 0,transparent 45%),var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(1050px,calc(100% - 32px)); margin:48px auto 72px; }
    header { margin-bottom:28px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem,6vw,3.5rem); line-height:1.05; letter-spacing:-.04em; }
    h2 { margin:0 0 14px; font-size:1.15rem; }
    p { margin:0; color:var(--muted); }
    .eyebrow { color:var(--blue); font-size:.78rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; margin-bottom:10px; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
    .card { background:linear-gradient(145deg,rgba(23,36,58,.98),rgba(17,28,46,.98)); border:1px solid var(--line); border-radius:16px; padding:22px; }
    .hero { grid-column:span 5; min-height:230px; }
    .rate { grid-column:span 7; }
    .wide { grid-column:span 12; }
    .half { grid-column:span 6; }
    .metric { font-size:clamp(2.5rem,8vw,4.8rem); line-height:1; font-weight:750; letter-spacing:-.055em; margin:14px 0 10px; }
    .metric small { font-size:.28em; color:var(--muted); letter-spacing:0; font-weight:600; }
    .track { height:10px; border-radius:9px; background:#263650; overflow:hidden; margin:18px 0 9px; }
    .track span { display:block; height:100%; background:linear-gradient(90deg,#4a91ff,#61ddb0); border-radius:9px; }
    .sub { font-size:.9rem; }
    .facts { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
    .fact { padding:14px; background:#0d1728; border-radius:12px; border:1px solid #22334e; }
    .fact b { display:block; color:var(--text); font-size:1.05rem; margin-bottom:3px; }
    .tag { display:inline-block; border:1px solid #37634f; color:var(--green); border-radius:99px; padding:3px 10px; font-size:.78rem; font-weight:700; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:760px; border-collapse:collapse; margin-top:12px; font-size:.92rem; }
    th,td { padding:11px 9px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; }
    td:last-child,th:last-child { text-align:right; }
    .opportunities { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px; }
    .opportunity { padding:14px; background:#0d1728; border-radius:12px; border:1px solid #22334e; }
    .opportunity b { display:block; margin-bottom:5px; }
    .note { margin-top:12px; font-size:.84rem; }
    a { color:var(--blue); }
    footer { color:var(--muted); font-size:.85rem; margin-top:18px; }
    .error { color:#ffc5a8; }
    @media(max-width:700px) { main{margin-top:28px}.hero,.rate,.half{grid-column:span 12}.facts{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Pokémon Showdown · VGC · Closed Team Sheet</div>
      <h1>Agent training progress</h1>
      <p>Progress toward robust VGC play, measured across held-out teams and varied opponent policies.</p>
    </header>
    <section class="grid" aria-live="polite" id="dashboard">
      <article class="card wide"><p>Loading the latest committed training summary…</p></article>
    </section>
    <footer id="updated"></footer>
  </main>
  <script>
    const esc = value => String(value ?? "—").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    fetch("progress.json", {cache:"no-store"}).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }).then(d => {
      const rows = (d.evaluation_scorecard ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.score)}</td><td>${esc(x.games)}</td><td>${esc(x.interval)}</td><td>${esc(x.status)}</td></tr>`).join("");
      const profiles = (d.speed?.profile ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.matches_per_second)}</td><td>${esc(x.end_to_end_ms)} ms</td><td>${esc(x.action_ms)} ms</td><td>${esc(x.inference_ms)} ms</td><td>${esc(x.baseline_ms)} ms</td><td>${esc(x.encoding_ms)} ms</td><td>${esc(x.engine_ms)} ms</td><td>${esc(x.persistence_ms)} ms</td></tr>`).join("");
      const opportunities = (d.speed?.opportunities ?? []).map(x => `<div class="opportunity"><b>${esc(x.title)}</b><span class="sub">${esc(x.detail)}</span></div>`).join("");
      const remainder = (d.speed?.remaining_components ?? []).map(x => `<tr><td>${esc(x.component)}</td><td>${esc(x.ms)} ms</td><td>${esc(x.share)}</td><td>${esc(x.note)}</td></tr>`).join("");
      const scaling = (d.speed?.worker_scaling ?? []).map(x => `<tr><td>${esc(x.workers)}</td><td>${esc(x.games_per_second)}</td><td>${esc(x.elapsed_seconds)} s</td><td>${esc(x.peak_rss_gb)} GiB</td></tr>`).join("");
      const inference = (d.speed?.policy_inference_benchmark?.results ?? []).map(x => `<tr><td>${esc(x.device)}</td><td>${esc(x.batch_states)}</td><td>${esc(x.states_per_second)}</td><td>${esc(x.median_ms)} ms</td><td>${esc(x.p95_ms)} ms</td></tr>`).join("");
      const cacheBenchmark = d.speed?.counterplay_cache_benchmark ?? {};
      const pct = Math.max(0, Math.min(100, Number(d.candidate?.win_rate_pct ?? 0)));
      document.querySelector("#dashboard").innerHTML = `
        <article class="card hero">
          <span class="tag">${esc(d.objective?.status ?? "Active research")}</span>
          <div class="eyebrow" style="margin-top:18px">Project objective</div>
          <h2>${esc(d.objective?.title ?? "Improve robust play across opponents")}</h2>
          <p>${esc(d.objective?.summary ?? "No single matchup percentage is treated as the finish line. Compare the agent across opponents, teams, sides, and repeated outcomes.")}</p>
          <p class="sub" style="margin-top:14px">${esc(d.candidate?.label)}: Round ${esc(d.candidate?.round)} · ${pct.toFixed(2)}% · ${esc(d.candidate?.games)} games · ${esc(d.candidate?.ci95)} cluster interval.</p><p class="note">${esc(d.candidate?.status)}. ${esc(d.candidate?.note)}</p>
        </article>
        <article class="card rate"><div class="eyebrow">Runtime</div><h2>Measured match speed</h2><div class="metric">${esc(d.speed?.games_per_second)}<small> games/sec</small></div><p class="sub">${esc(d.speed?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.decision_latency)}</b><span class="sub">decision latency</span></div><div class="fact"><b>${esc(d.speed?.current_bottleneck)}</b><span class="sub">current bottleneck</span></div><div class="fact"><b>${esc(d.speed?.gpu_status)}</b><span class="sub">GPU path</span></div></div></article>
        <article class="card half"><div class="eyebrow">Latest training run</div><h2>Round ${esc(d.latest_run?.round)} · ${esc(d.latest_run?.status)}</h2><p>${esc(d.latest_run?.summary)}</p><div class="facts"><div class="fact"><b>${esc(d.latest_run?.games)}</b><span class="sub">self-play games</span></div><div class="fact"><b>${esc(d.latest_run?.epochs)}</b><span class="sub">PPO passes</span></div><div class="fact"><b>${esc(d.latest_run?.evaluation)}</b><span class="sub">evaluation</span></div></div></article>
        <article class="card wide"><div class="eyebrow">Detailed rollout profile · Round ${esc(d.speed?.active_training_profile?.round)}</div><h2>${esc(d.speed?.active_training_profile?.status)}</h2><p>${esc(d.speed?.active_training_profile?.context)}</p><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Completed episodes</th><th>Shard games/s</th><th>End-to-end</th><th>Action selection</th><th>Inference¹</th><th>Counterplay scoring¹</th><th>Encoding</th><th>Showdown engine</th><th>Trajectory write</th></tr></thead><tbody>${(d.speed?.active_training_profile?.profile ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.completed_episodes)}</td><td>${esc(x.matches_per_second)}</td><td>${esc(x.end_to_end_ms)} ms</td><td>${esc(x.action_ms)} ms</td><td>${esc(x.inference_ms)} ms</td><td>${esc(x.baseline_ms)} ms</td><td>${esc(x.encoding_ms)} ms</td><td>${esc(x.engine_ms)} ms</td><td>${esc(x.persistence_ms)} ms</td></tr>`).join("")}</tbody></table></div><p>${esc(d.speed?.active_training_profile?.finding)}</p><p class="note">¹ Inference and counterplay scoring are nested inside action selection. These shard rates are per-worker and are not the full mixed-run throughput.</p></article>
        <article class="card half"><div class="eyebrow">Method</div><h2>What is being improved</h2><p>${esc(d.method)}</p><p style="margin-top:14px">${esc(d.jax_decision)}</p></article>
        <article class="card wide"><div class="eyebrow">Held-out evaluation</div><h2>Opponent scorecard</h2><p>Win/draw score rates use paired team clusters and side swaps where available. Historical PPO identifies the fixed checkpoint used for comparison.</p><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Score</th><th>Games</th><th>95% cluster interval</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="5">New evaluation rows are being collected.</td></tr>'}</tbody></table></div><p class="note">${esc(d.evaluation_note)}</p></article>
        <article class="card wide"><div class="eyebrow">Runtime profiling</div><h2>Where rollout time goes</h2><p>${esc(d.speed?.profile_context)}</p><div class="table-wrap"><table><thead><tr><th>Opponent mix</th><th>Shard games/s</th><th>End-to-end</th><th>Action selection</th><th>Policy inference¹</th><th>Counterplay scoring¹</th><th>Observation encoding</th><th>Showdown engine</th><th>Trajectory write</th></tr></thead><tbody>${profiles}</tbody></table></div><p class="note">¹ Nested inside action selection; do not add these columns to the end-to-end total.</p><p style="margin-top:14px">${esc(d.speed?.remaining_summary)}</p><div class="table-wrap"><table><thead><tr><th>Non-engine stage (historical-policy workload)</th><th>Time / match</th><th>Share of non-engine time</th><th>Measured work</th></tr></thead><tbody>${remainder}</tbody></table></div><p style="margin-top:14px">${esc(d.speed?.worker_scaling_context)}</p><div class="table-wrap"><table><thead><tr><th>Rollout workers</th><th>Aggregate games/s</th><th>Elapsed for 240 games</th><th>Peak aggregate RSS</th></tr></thead><tbody>${scaling}</tbody></table></div><h2 style="margin-top:24px">Policy inference batching probe</h2><p>${esc(d.speed?.policy_inference_benchmark?.context)} Feature preparation averaged ${esc(d.speed?.policy_inference_benchmark?.feature_preparation_ms_per_state)} ms/state; native action-feature generation averaged ${esc(d.speed?.policy_inference_benchmark?.native_action_feature_estimation_ms_per_state)} ms/state after initialization (${esc(d.speed?.policy_inference_benchmark?.native_action_feature_first_call_ms)} ms on its first call).</p><div class="table-wrap"><table><thead><tr><th>Device</th><th>Batch states</th><th>States/sec</th><th>Median batch time</th><th>p95 batch time</th></tr></thead><tbody>${inference}</tbody></table></div><p class="note">${esc(d.speed?.policy_inference_benchmark?.interpretation)} See raw report: <code>${esc(d.speed?.policy_inference_benchmark?.report)}</code></p><p class="note">Feature record audit: ${esc(d.speed?.policy_inference_benchmark?.feature_replay_caveat)}</p><h2 style="margin-top:24px">Shared GPU inference queue test</h2><p>${esc(d.speed?.shared_inference_queue_benchmark?.context)}</p><div class="table-wrap"><table><thead><tr><th>Concurrent workers</th><th>CPU states/s</th><th>CPU p95</th><th>GPU queue states/s</th><th>GPU p95</th><th>GPU mean batch</th></tr></thead><tbody><tr><td>8</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.cpu_8_workers_states_per_second)}</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.cpu_8_workers_p95_ms)} ms</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.gpu_8_workers_states_per_second)}</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.gpu_8_workers_p95_ms)} ms</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.gpu_8_workers_mean_batch_1ms)}</td></tr><tr><td>16</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.cpu_16_workers_states_per_second)}</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.cpu_16_workers_p95_ms)} ms</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.gpu_16_workers_states_per_second)}</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.gpu_16_workers_p95_ms)} ms</td><td>${esc(d.speed?.shared_inference_queue_benchmark?.gpu_16_workers_mean_batch_1ms)}</td></tr></tbody></table></div><p>${esc(d.speed?.shared_inference_queue_benchmark?.finding)}</p><p class="note">${esc(d.speed?.shared_inference_queue_benchmark?.scope_note)} <a href="${esc(d.speed?.shared_inference_queue_benchmark?.report)}">Raw queue benchmark</a></p><h2 style="margin-top:24px">Live policy static-team cache</h2><p>${esc(d.speed?.live_team_cache_benchmark?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.live_team_cache_benchmark?.uncached_median_seconds)} → ${esc(d.speed?.live_team_cache_benchmark?.cached_median_seconds)} s</b><span class="sub">model-input construction · ${esc(d.speed?.live_team_cache_benchmark?.transitions)} real states</span></div><div class="fact"><b>${esc(d.speed?.live_team_cache_benchmark?.reduction_pct)}%</b><span class="sub">stage reduction · exact input parity</span></div><div class="fact"><b>~${esc(d.speed?.live_team_cache_benchmark?.estimated_seconds_saved_162366_states)} s</b><span class="sub">linear estimate for 162,366 PPO states</span></div><div class="fact"><b>${esc(d.speed?.live_team_cache_benchmark?.live_action_parity ? "Exact" : "Not verified")}</b><span class="sub">deterministic action, log-probability and value</span></div></div><p class="note">${esc(d.speed?.live_team_cache_benchmark?.scope_note)} <a href="${esc(d.speed?.live_team_cache_benchmark?.report)}">Raw benchmark report</a></p><h2 style="margin-top:24px">PPO input-preparation cache benchmark</h2><p>${esc(d.speed?.ppo_input_preparation_benchmark?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.ppo_input_preparation_benchmark?.clone_median_seconds)} → ${esc(d.speed?.ppo_input_preparation_benchmark?.reuse_median_seconds)} s</b><span class="sub">median input-build time</span></div><div class="fact"><b>${esc(d.speed?.ppo_input_preparation_benchmark?.reduction_pct)}%</b><span class="sub">stage reduction · exact tensor parity</span></div><div class="fact"><b>~${esc(d.speed?.ppo_input_preparation_benchmark?.estimated_seconds_saved_full_preparation)} s</b><span class="sub">linear estimate for full Round435 preparation</span></div></div><p class="note">${esc(d.speed?.ppo_input_preparation_benchmark?.estimate_context)} <a href="${esc(d.speed?.ppo_input_preparation_benchmark?.report)}">Raw benchmark report</a></p><h2 style="margin-top:24px">PPO transition-extraction benchmark</h2><p>${esc(d.speed?.rollout_extraction_microbenchmark?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.rollout_extraction_microbenchmark?.old_median_seconds)} → ${esc(d.speed?.rollout_extraction_microbenchmark?.new_median_seconds)} s</b><span class="sub">median extraction time</span></div><div class="fact"><b>${esc(d.speed?.rollout_extraction_microbenchmark?.reduction_pct)}%</b><span class="sub">stage reduction · exact feature parity</span></div><div class="fact"><b>~${esc(d.speed?.rollout_extraction_microbenchmark?.estimated_seconds_saved_full_preparation)} s</b><span class="sub">linear estimate for 20k PPO records</span></div></div><p class="note">${esc(d.speed?.rollout_extraction_microbenchmark?.estimate_context)} <a href="${esc(d.speed?.rollout_extraction_microbenchmark?.report)}">Raw benchmark report</a></p><h2 style="margin-top:24px">PPO hidden-target precompute probe</h2><p>${esc(d.speed?.ppo_hidden_target_precompute_benchmark?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.ppo_hidden_target_precompute_benchmark?.before_median_seconds)} → ${esc(d.speed?.ppo_hidden_target_precompute_benchmark?.after_median_seconds)} s</b><span class="sub">median transition-extraction time</span></div><div class="fact"><b>${esc(d.speed?.ppo_hidden_target_precompute_benchmark?.reduction_pct)}%</b><span class="sub">stage reduction · exact transition parity</span></div><div class="fact"><b>~${esc(d.speed?.ppo_hidden_target_precompute_benchmark?.estimated_seconds_saved_full_preparation)} s</b><span class="sub">linear estimate per 20k rollout</span></div></div><p class="note">${esc(d.speed?.ppo_hidden_target_precompute_benchmark?.estimate_context)} <a href="${esc(d.speed?.ppo_hidden_target_precompute_benchmark?.report)}">Raw benchmark report</a></p><h2 style="margin-top:24px">PPO observation-array reuse probe</h2><p>${esc(d.speed?.ppo_observation_array_reuse_benchmark?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.ppo_observation_array_reuse_benchmark?.before_median_seconds)} → ${esc(d.speed?.ppo_observation_array_reuse_benchmark?.after_median_seconds)} s</b><span class="sub">median transition-extraction time</span></div><div class="fact"><b>${esc(d.speed?.ppo_observation_array_reuse_benchmark?.reduction_pct)}%</b><span class="sub">stage reduction · exact transition parity</span></div><div class="fact"><b>~${esc(d.speed?.ppo_observation_array_reuse_benchmark?.estimated_seconds_saved_full_preparation)} s</b><span class="sub">linear estimate per 20k rollout</span></div></div><p class="note">${esc(d.speed?.ppo_observation_array_reuse_benchmark?.estimate_context)} <a href="${esc(d.speed?.ppo_observation_array_reuse_benchmark?.report)}">Raw benchmark report</a></p><h2 style="margin-top:24px">Full PPO replay with preprocessing changes</h2><p>${esc(d.speed?.ppo_full_update_replay?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.ppo_full_update_replay?.wall_seconds)} s</b><span class="sub">Round441 total wall time</span></div><div class="fact"><b>${esc(d.speed?.ppo_full_update_replay?.sample_collection_seconds)} s</b><span class="sub">sample collection</span></div><div class="fact"><b>${esc(d.speed?.ppo_full_update_replay?.optimization_seconds_approximate)} s</b><span class="sub">optimizer · approximate</span></div><div class="fact"><b>${esc(d.speed?.ppo_full_update_replay?.round437_preflight_reuse_wall_seconds)} / ${esc(d.speed?.ppo_full_update_replay?.round438_legacy_control_wall_seconds)} s</b><span class="sub">prior replay wall times</span></div></div><p>${esc(d.speed?.ppo_full_update_replay?.finding)} <a href="${esc(d.speed?.ppo_full_update_replay?.report)}">Full replay profile</a></p><h2 style="margin-top:24px">Audited PPO offset-index replay</h2><p>${esc(d.speed?.ppo_offset_index_replay?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.ppo_offset_index_replay?.sample_collection_seconds)} s</b><span class="sub">sample preparation · ${esc(d.speed?.ppo_offset_index_replay?.games)} audited games</span></div><div class="fact"><b>${esc(d.speed?.ppo_offset_index_replay?.transitions)}</b><span class="sub">transitions · exact audited count</span></div><div class="fact"><b>${esc(d.speed?.ppo_offset_index_replay?.sample_preparation_reduction_vs_round441_pc

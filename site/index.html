<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2c">
  <title>VGC Agent Training Progress</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#131e31; --line:#263650; --muted:#a7b5c9; --text:#eef4ff; --blue:#72b7ff; --green:#72dfb1; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(ellipse at 15% 0%,#172846 0,transparent 45%),var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(1050px,calc(100% - 32px)); margin:48px auto 72px; }
    header { margin-bottom:28px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem,6vw,3.5rem); line-height:1.05; letter-spacing:-.04em; }
    h2 { margin:0 0 14px; font-size:1.15rem; }
    p { margin:0; color:var(--muted); }
    .eyebrow { color:var(--blue); font-size:.78rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; margin-bottom:10px; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
    .card { background:linear-gradient(145deg,rgba(23,36,58,.98),rgba(17,28,46,.98)); border:1px solid var(--line); border-radius:16px; padding:22px; }
    .hero { grid-column:span 5; min-height:230px; }
    .rate { grid-column:span 7; }
    .wide { grid-column:span 12; }
    .half { grid-column:span 6; }
    .metric { font-size:clamp(2.5rem,8vw,4.8rem); line-height:1; font-weight:750; letter-spacing:-.055em; margin:14px 0 10px; }
    .metric small { font-size:.28em; color:var(--muted); letter-spacing:0; font-weight:600; }
    .track { height:10px; border-radius:9px; background:#263650; overflow:hidden; margin:18px 0 9px; }
    .track span { display:block; height:100%; background:linear-gradient(90deg,#4a91ff,#61ddb0); border-radius:9px; }
    .sub { font-size:.9rem; }
    .facts { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
    .fact { padding:14px; background:#0d1728; border-radius:12px; border:1px solid #22334e; }
    .fact b { display:block; color:var(--text); font-size:1.05rem; margin-bottom:3px; }
    .tag { display:inline-block; border:1px solid #37634f; color:var(--green); border-radius:99px; padding:3px 10px; font-size:.78rem; font-weight:700; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:760px; border-collapse:collapse; margin-top:12px; font-size:.92rem; }
    th,td { padding:11px 9px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; }
    td:last-child,th:last-child { text-align:right; }
    .opportunities { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px; }
    .opportunity { padding:14px; background:#0d1728; border-radius:12px; border:1px solid #22334e; }
    .opportunity b { display:block; margin-bottom:5px; }
    .note { margin-top:12px; font-size:.84rem; }
    a { color:var(--blue); }
    footer { color:var(--muted); font-size:.85rem; margin-top:18px; }
    .error { color:#ffc5a8; }
    @media(max-width:700px) { main{margin-top:28px}.hero,.rate,.half{grid-column:span 12}.facts{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Pokémon Showdown · VGC · Closed Team Sheet</div>
      <h1>Agent training progress</h1>
      <p>Progress toward robust VGC play, measured across held-out teams and varied opponent policies.</p>
      <p style="margin-top:12px"><a href="play.html">Play against the latest bot checkpoint →</a></p>
    </header>
    <section class="grid" aria-live="polite" id="dashboard">
      <article class="card wide"><p>Loading the latest committed training summary…</p></article>
    </section>
    <footer id="updated"></footer>
  </main>
  <script>
    const esc = value => String(value ?? "—").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    fetch("progress.json", {cache:"no-store"}).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }).then(d => {
      const rows = (d.evaluation_scorecard ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.score)}</td><td>${esc(x.games)}</td><td>${esc(x.interval)}</td><td>${esc(x.status)}</td></tr>`).join("");
      const profiles = (d.speed?.profile ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.matches_per_second)}</td><td>${esc(x.end_to_end_ms)} ms</td><td>${esc(x.action_ms)} ms</td><td>${esc(x.inference_ms)} ms</td><td>${esc(x.baseline_ms)} ms</td><td>${esc(x.encoding_ms)} ms</td><td>${esc(x.engine_ms)} ms</td><td>${esc(x.persistence_ms)} ms</td></tr>`).join("");
      const opportunities = (d.speed?.opportunities ?? []).map(x => `<div class="opportunity"><b>${esc(x.title)}</b><span class="sub">${esc(x.detail)}</span></div>`).join("");
      const remainder = (d.speed?.remaining_components ?? []).map(x => `<tr><td>${esc(x.component)}</td><td>${esc(x.ms)} ms</td><td>${esc(x.share)}</td><td>${esc(x.note)}</td></tr>`).join("");
      const scaling = (d.speed?.worker_scaling ?? []).map(x => `<tr><td>${esc(x.workers)}</td><td>${esc(x.games_per_second)}</td><td>${esc(x.elapsed_seconds)} s</td><td>${esc(x.peak_rss_gb)} GiB</td></tr>`).join("");
      const inference = (d.speed?.policy_inference_benchmark?.results ?? []).map(x => `<tr><td>${esc(x.device)}</td><td>${esc(x.batch_states)}</td><td>${esc(x.states_per_second)}</td><td>${esc(x.median_ms)} ms</td><td>${esc(x.p95_ms)} ms</td></tr>`).join("");
      const cacheBenchmark = d.speed?.counterplay_cache_benchmark ?? {};
      const iterationProfile = d.speed?.round464_full_iteration_profile ?? d.speed?.round463_full_iteration_profile ?? d.speed?.round462_full_iteration_profile ?? {};
      const round463Evaluation = d.round463_evaluation ?? {};
      const round463EvalRows = (round463Evaluation.opponents ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.score_percent)}%</td><td>${esc(x.cluster_bootstrap_95_pct?.[0])}%–${esc(x.cluster_bootstrap_95_pct?.[1])}%</td><td>${esc(x.games)}</td><td>${esc(x.clusters)}</td><td>${esc(x.parallel_evaluation_games_per_second)}</td><td>${esc(x.action_adjustments)}</td></tr>`).join("");
      const round463ControlRows = (round463Evaluation.matched_max_damage_controls ?? []).map(x => `<tr><td>${esc(x.control)}</td><td>${esc(x.control_score_percent)}%</td><td>${esc(x.round463_score_percent)}%</td><td>${esc(x.paired_delta_percentage_points)} pp</td><td>${esc(x.paired_delta_cluster_bootstrap_95_pp?.[0])}–${esc(x.paired_delta_cluster_bootstrap_95_pp?.[1])} pp</td><td>${esc(x.clusters_tie)}</td></tr>`).join("");
      const round464Evaluation = d.round464_evaluation ?? {};
      const round464EvalRows = (round464Evaluation.opponents ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.score_percent)}%</td><td>${esc(x.cluster_bootstrap_95_pct?.[0])}%–${esc(x.cluster_bootstrap_95_pct?.[1])}%</td><td>${esc(x.games)}</td><td>${esc(x.clusters)}</td><td>${esc(x.evaluation_games_per_second)}</td></tr>`).join("");
      const round464ControlRows = (round464Evaluation.matched_max_damage_controls ?? []).map(x => `<tr><td>${esc(x.control)}</td><td>${esc(x.control_score_percent)}%</td><td>${esc(x.round464_score_percent)}%</td><td>${esc(x.paired_delta_percentage_points)} pp</td><td>${esc(x.paired_delta_cluster_bootstrap_95_pp?.[0])}–${esc(x.paired_delta_cluster_bootstrap_95_pp?.[1])} pp</td><td>${esc(x.clusters_tie)}</td></tr>`).join("");
      const round465Evaluation = d.round465_evaluation ?? {};
      const round465EvalRows = (round465Evaluation.opponents ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.round465_score_percent)}%</td><td>${esc(x.cluster_bootstrap_95_pct?.[0])}%–${esc(x.cluster_bootstrap_95_pct?.[1])}%</td><td>${esc(x.games)}</td><td>${esc(x.clusters)}</td><td>${esc(x.evaluation_games_per_second)}</td><td>${esc(x.action_adjustments)}</td></tr>`).join("");
      const round465ControlRows = (round465Evaluation.matched_max_damage_controls ?? []).map(x => `<tr><td>${esc(x.control)}</td><td>${esc(x.control_score_percent)}%</td><td>${esc(x.round465_score_percent)}%</td><td>${esc(x.paired_delta_percentage_points)} pp</td><td>${esc(x.paired_delta_cluster_bootstrap_95_pp?.[0])}–${esc(x.paired_delta_cluster_bootstrap_95_pp?.[1])} pp</td><td>${esc(x.clusters_tie)}</td></tr>`).join("");
      const stochasticDiagnostic = d.stochastic_action_diagnostic ?? {};
      const stochasticRows = (stochasticDiagnostic.opponents ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.deterministic_score_pct)}%</td><td>${esc(x.stochastic_score_pct)}%</td><td>${esc(x.paired_delta_stochastic_minus_deterministic_pp)} pp</td><td>${esc(x.paired_delta_cluster_bootstrap_95_pp?.[0])}–${esc(x.paired_delta_cluster_bootstrap_95_pp?.[1])} pp</td><td>${esc(x.matched_complete_clusters)}</td><td>${esc(x.deterministic_timeouts_or_errors)} / ${esc(x.stochastic_timeouts_or_errors)}</td></tr>`).join("");
      const round462Evaluation = d.round462_evaluation ?? {};
      const round462EvalRows = (round462Evaluation.opponents ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.score_percent)}%</td><td>${esc(x.cluster_bootstrap_95_pct?.[0])}%–${esc(x.cluster_bootstrap_95_pct?.[1])}%</td><td>${esc(x.games)}</td><td>${esc(x.clusters)}</td><td>${esc(x.parallel_evaluation_games_per_second)}</td><td>${esc(x.action_adjustments)}</td></tr>`).join("");
      const round462ControlRows = (round462Evaluation.matched_max_damage_controls ?? []).map(x => `<tr><td>${esc(x.control)}</td><td>${esc(x.control_score_percent)}%</td><td>${esc(x.round462_score_percent)}%</td><td>${esc(x.paired_delta_percentage_points)} pp</td><td>${esc(x.paired_delta_cluster_bootstrap_95_pp?.[0])}–${esc(x.paired_delta_cluster_bootstrap_95_pp?.[1])} pp</td><td>${esc(x.clusters_tie)}</td></tr>`).join("");
      const iterationStages = (iterationProfile.iteration_stages ?? []).map(x => `<tr><td>${esc(x.stage)}</td><td>${esc(x.seconds)} s</td><td>${esc(x.share)}</td></tr>`).join("\n");
      const ppoStages = (iterationProfile.ppo_stages ?? []).map(x => `<tr><td>${esc(x.stage)}</td><td>${esc(x.seconds)} s</td></tr>`).join("");
      const rolloutStages = (iterationProfile.rollout_stages ?? []).map(x => `<tr><td>${esc(x.stage)}</td><td>${esc(x.ms)} ms</td><td>${esc(x.share ?? "—")}</td></tr>`).join("");
      const speedOpportunities = (iterationProfile.opportunities ?? []).map(x => `<li><b>${esc(x.title)}:</b> ${esc(x.detail)}</li>`).join("");
      const pct = Math.max(0, Math.min(100, Number(d.candidate?.win_rate_pct ?? 0)));
      document.querySelector("#dashboard").innerHTML = `
        <article class="card hero">
          <span class="tag">${esc(d.objective?.status ?? "Active research")}</span>
          <div class="eyebrow" style="margin-top:18px">Project objective</div>
          <h2>${esc(d.objective?.title ?? "Improve robust play across opponents")}</h2>
          <p>${esc(d.objective?.summary ?? "No single matchup percentage is treated as the finish line. Compare the agent across opponents, teams, sides, and repeated outcomes.")}</p>
          <p class="sub" style="margin-top:14px">${esc(d.candidate?.label)}: Round ${esc(d.candidate?.round)} · ${pct.toFixed(2)}% · ${esc(d.candidate?.games)} games · ${esc(d.candidate?.ci95)} cluster interval.</p><p class="note">${esc(d.candidate?.status)}. ${esc(d.candidate?.note)}</p>
        </article>
        <article class="card rate"><div class="eyebrow">Runtime</div><h2>Measured match speed</h2><div class="metric">${esc(d.speed?.games_per_second)}<small> games/sec</small></div><p class="sub">${esc(d.speed?.context)}</p><div class="facts"><div class="fact"><b>${esc(d.speed?.decision_latency)}</b><span class="sub">decision latency</span></div><div class="fact"><b>${esc(d.speed?.current_bottleneck)}</b><span class="sub">current bottleneck</span></div><div class="fact"><b>${esc(d.speed?.gpu_status)}</b><span class="sub">GPU path</span></div></div></article>
        <article class="card half"><div class="eyebrow">Latest training run</div><h2>Round ${esc(d.latest_run?.round)} · ${esc(d.latest_run?.status)}</h2><p>${esc(d.latest_run?.summary)}</p><div class="facts"><div class="fact"><b>${esc(d.latest_run?.games)}</b><span class="sub">self-play games</span></div><div class="fact"><b>${esc(d.latest_run?.epochs)}</b><span class="sub">PPO passes</span></div><div class="fact"><b>${esc(d.latest_run?.evaluation)}</b><span class="sub">evaluation</span></div></div></article>
        <article class="card wide"><div class="eyebrow">Full training profile · Round ${esc(iterationProfile.round)}</div><h2>Measured speed and remaining work</h2><p>${esc(iterationProfile.summary ?? "Latest full training iteration profile") }</p><div class="facts"><div class="fact"><b>${esc(iterationProfile.observed_rollout_games_per_second)} games/s</b><span class="sub">8-worker aggregate rollout · ${esc(iterationProfile.observed_rollout_wall_seconds)} s</span></div><div class="fact"><b>${esc(iterationProfile.observed_workflow_games_per_second)} games/s</b><span class="sub">full iteration · rollout, audit, and PPO</span></div><div class="fact"><b>${esc(iterationProfile.ppo_sample_preparation_seconds)} / ${esc(iterationProfile.ppo_wall_seconds)} s</b><span class="sub">PPO preparation / full PPO update</span></div><div class="fact"><b>${esc(iterationProfile.transitions)}</b><span class="sub">transitions · ${esc(iterationProfile.peak_rss_gib)} GiB peak RSS</span></div></div><h3 style="margin-top:18px">Full iteration wall-time breakdown</h3><div class="table-wrap"><table><thead><tr><th>Phase</th><th>Elapsed</th><th>Share</th></tr></thead><tbody>${iterationStages}</tbody></table></div><h3 style="margin-top:18px">PPO update stages</h3><div class="table-wrap"><table><thead><tr><th>Stage</th><th>Elapsed</th></tr></thead><tbody>${ppoStages}</tbody></table></div><h3 style="margin-top:18px">Rollout cost per episode</h3><div class="table-wrap"><table><thead><tr><th>Stage</th><th>Mean time</th><th>Share</th></tr></thead><tbody>${rolloutStages}</tbody></table></div><p class="note">Inference and baseline scoring are nested inside action selection and must not be added twice. ${esc(iterationProfile.timing_caveat)}</p><h3 style="margin-top:18px">Speed-up opportunities</h3><ul>${speedOpportunities}</ul><p class="note"><a href="${esc(iterationProfile.report)}">Round464 raw profile</a> · <a href="https://github.com/${esc(d.repository)}/blob/master/PLAN.md">Updated training plan</a></p></article>
        <article class="card wide"><div class="eyebrow">Detailed rollout profile · Round ${esc(d.speed?.active_training_profile?.round)}</div><h2>${esc(d.speed?.active_training_profile?.status)}</h2><p>${esc(d.speed?.active_training_profile?.context)}</p><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Completed episodes</th><th>Shard games/s</th><th>End-to-end</th><th>Action selection</th><th>Inference¹</th><th>Counterplay scoring¹</th><th>Encoding</th><th>Showdown engine</th><th>Trajectory write</th></tr></thead><tbody>${(d.speed?.active_training_profile?.profile ?? []).map(x => `<tr><td>${esc(x.opponent)}</td><td>${esc(x.completed_episodes)}</td><td>${esc(x.matches_per_second)}</td><td>${esc(x.end_to_end_ms)} ms</td><td>${esc(x.action_ms)} ms</td><td>${esc(x.inference_ms)} ms</td><td>${esc(x.baseline_ms)} ms</td><td>${esc(x.encoding_ms)} ms</td><td>${esc(x.engine_ms)} ms</td><td>${esc(x.persistence_ms)} ms</td></tr>`).join("")}</tbody></table></div><p>${esc(d.speed?.active_training_profile?.finding)}</p><p class="note">¹ Inference and counterplay scoring are nested inside action selection. These shard rates are per-worker and are not the full mixed-run throughput.</p></article>
        <article class="card half"><div class="eyebrow">Method</div><h2>What is being improved</h2><p>${esc(d.method)}</p><p style="margin-top:14px"><b>Move selection:</b> ${esc(d.action_selection)}</p><p style="margin-top:14px">${esc(d.jax_decision)}</p></article>
        <article class="card wide"><div class="eyebrow">Held-out evaluation</div><h2>Opponent scorecard</h2><p>Win/draw score rates use paired team clusters and side swaps where available. Historical PPO identifies the fixed checkpoint used for comparison.</p><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Score</th><th>Games</th><th>95% cluster interval</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="5">New evaluation rows are being collected.</td></tr>'}</tbody></table></div><p class="note">${esc(d.evaluation_note)}</p></article>
        <article class="card wide"><div class="eyebrow">Latest paired evaluation · Round463</div><h2>${esc(round463Evaluation.status)}</h2><p>${esc(round463Evaluation.summary)}</p><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Score</th><th>95% cluster interval</th><th>Games</th><th>Team pairs</th><th>Evaluation games/s</th><th>Action adjustments</th></tr></thead><tbody>${round463EvalRows}</tbody></table></div><h3 style="margin-top:18px">Matched Max Damage controls on identical teams and seeds</h3><div class="table-wrap"><table><thead><tr><th>Control checkpoint</th><th>Control score</th><th>Round463 score</th><th>Paired delta</th><th>95% paired interval</th><th>Tied team pairs</th></tr></thead><tbody>${round463ControlRows}</tbody></table></div><p>${esc(round463Evaluation.recovery_note)}</p><p class="note">${esc(round463Evaluation.method)} <a href="${esc(round463Evaluation.report)}">Round463 evaluation report</a></p></article>
        <article class="card wide"><div class="eyebrow">Latest paired evaluation · Round464</div><h2>${esc(round464Evaluation.status)}</h2><p>${esc(round464Evaluation.summary)}</p><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Score</th><th>95% cluster interval</th><th>Games</th><th>Team pairs</th><th>Evaluation games/s</th></tr></thead><tbody>${round464EvalRows}</tbody></table></div><h3 style="margin-top:18px">Matched Max Damage controls on identical teams and seeds</h3><div class="table-wrap"><table><thead><tr><th>Control checkpoint</th><th>Control score</th><th>Round464 score</th><th>Paired delta</th><th>95% paired interval</th><th>Tied team pairs</th></tr></thead><tbody>${round464ControlRows}</tbody></table></div><p>${esc(round464Evaluation.recovery_note)}</p><p>${esc(round464Evaluation.trace_diagnostic)}</p><p class="note">${esc(round464Evaluation.method)} <a href="${esc(round464Evaluation.report)}">Round464 evaluation report</a></p></article>
        <article class="card wide"><div class="eyebrow">Latest paired evaluation · Round465</div><h2>${esc(round465Evaluation.status)}</h2><p>${esc(round465Evaluation.summary)}</p><div class="table-wrap"><table><thead><tr><th>Opponent</th><th>Score</th><th>95% cluster interval</th><th>Games</th><th>Team pairs</th><th>Evaluation games/s</th><th>Action adjustments</th></tr></thead><tbody>${round465EvalRows}</tbody></table></div><h3 style="margin-top:18px">Matched Max Damage controls on identical teams and seeds</h3><div class="table-wrap"><table><thead><tr><th>Control checkpoint</th><th>Control score</th><th>Round465 score</th><th>Paired delta</th><th>95% paired interval</th><th>Tied team pairs</th></tr></thead><tbody>${round465ControlRows}</tbody></table></div><p>${esc(round465Evaluation.recovery_note)}</p><p><b>Move selection:</b> ${esc(round465Evaluation.decision_flow)}</p><p><b>Exploratory decision traces:</b> ${esc(round465Evaluation.trace_diagnostic)} <a href="${esc(round465Evaluation.trace_report)}">Trace report</a></p><p><b>Opening counterfactual pilot:</b> ${esc(round465Evaluation.opening_counterfactual_diagnostic)} <a href="${esc(round465Evaluation.opening_counterfactual_report)}">Counterfactual report</a></p><p><b>Restricted PPO population matrix:</b> ${esc(round465Evaluation.restricted_matrix_diagnostic)} <a href="${esc(round465Evaluation.restricted_matrix_report)}">Three-checkpoint matrix</a></p><p class="note">${esc(round465Evaluation.method)} <a href="${esc(round465Evaluation.report)}">Round465 evaluation report</a></p></article>
